name = "paradigm-platform"
main = "src/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 静态资源（index.html / admin.html 放在 public/ 目录）
assets = { directory = "./public", binding = "ASSETS" }

[[d1_databases]]
binding = "DB"
database_name = "paradigm-platform"
database_id = "PLACEHOLDER_REPLACE_AFTER_CREATE"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "paradigm-uploads"

[vars]
SECRET_KEY = "xhs_game_theater_2026_secret_cf"
